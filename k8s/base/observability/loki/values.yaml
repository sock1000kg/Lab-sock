deploymentMode: SingleBinary
loki:
  commonConfig:
    replication_factor: 1
  auth_enabled: false
  storage:
    type: filesystem

  compactor:
    retention_enabled: true
    delete_request_store: filesystem # Required when retention_enabled

  limits_config:
    # Rate limits
    ingestion_rate_strategy: global
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    per_stream_rate_limit: 3MB
    per_stream_rate_limit_burst: 15MB

    # Stream limits
    max_global_streams_per_user: 10000
    max_streams_per_user: 0

    # Validation
    max_line_size: 256KB
    max_line_size_truncate: false
    max_label_name_length: 1024
    max_label_value_length: 2048
    max_label_names_per_series: 15

    # Time con
    # straints
    reject_old_samples: true
    reject_old_samples_max_age: 168h # 7 days
    creation_grace_period: 10m
    unordered_writes: true

    # Allow OTLP data
    allow_structured_metadata: true

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 15Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/observability
                operator: In
                values: ["true"]
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false

# Disable Simple Scalable mode cus apparrently setting deploymentMode is not enough
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

# Disable distributed-mode components
gateway:
  enabled: false

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0
